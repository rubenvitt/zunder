<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Zunder app icon (desktop/Android): macOS grid, 824 px tile with shadow. Same artwork as web/src/components/Logo.tsx. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e231d"/>
      <stop offset="1" stop-color="#110d0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.45">
      <stop offset="0" stop-color="#ff6a2a" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ff6a2a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="outer" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff4d1f"/>
      <stop offset="1" stop-color="#ffa63d"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffc35c"/>
      <stop offset="1" stop-color="#fff1b8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.32"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <g transform="translate(100 100) scale(12.875)">
    <path fill="url(#outer)" d="M33.5 8.5c1.6 7.4 11.9 12.6 11.9 26.1 0 9.6-6 17.4-13.4 17.4s-13.4-7.1-13.4-15.7c0-6.4 2.9-10.9 6.6-14 .1 4.6 2 7.4 4.6 8.7-.9-9.3.7-16.9 3.7-22.5Z"/>
    <path fill="url(#inner)" d="M32.6 30.6c2.1 4.7 7 7.6 7 13.6 0 4.5-3.4 7.8-7.6 7.8s-7.6-3.3-7.6-7.6c0-3.2 1.7-5.3 3.8-6.6.4 2.6 1.4 3.9 2.8 4.5-.5-5.1.2-8.5 1.6-11.7Z"/>
