[package]
name = "zunder-local"
description = "Lokaler Speicher, Sync und Erinnerungsplanung der Zunder-App (ohne Webview testbar)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
zunder-core.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
time.workspace = true
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
# Login (PKCE): verifier, state and challenge.
getrandom = "0.3"
sha2 = "0.10"
base64 = "0.22"
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
tempfile = "3"

[lints]
workspace = true
