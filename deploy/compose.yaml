# Zunder auf r-server hinter Traefik, manuell betrieben mit docker compose.
#
# Auf dem Server liegt dieser Ordner als ~/server/zunder/ (compose.yaml, .env, data/).
# Öffentliche Domain (zunder.rubeen.dev statt *.rubeen.home), weil claude.ai
# den MCP-Endpoint /mcp von außen erreichen muss. Details: docs/betrieb.md.
#
# Geheimnisse stehen in .env neben dieser Datei (Vorlage .env.example, befüllen mit
# ./generate-secrets.sh). Statische Werte stehen direkt hier.

name: zunder

networks:
  proxy:
    external: true

services:
  zunder:
    image: ghcr.io/rubenvitt/zunder:latest
    container_name: zunder
    restart: unless-stopped
    env_file: .env
    environment:
      - ZUNDER_PUBLIC_URL=https://zunder.rubeen.dev
      - ZUNDER_BIND=0.0.0.0:8080
      - ZUNDER_DATA_DIR=/data
      - ZUNDER_WEB_DIR=/app/web
      - ZUNDER_BACKUP_HOUR=3
      - TZ=Europe/Berlin
    volumes:
      # Der Container läuft als uid/gid 10001: vorher `sudo chown 10001:10001 data`.
      - ./data:/data
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.zunder.entrypoints=https"
      - "traefik.http.routers.zunder.rule=Host(`zunder.rubeen.dev`)"
      - "traefik.http.routers.zunder.tls.certresolver=letsencrypt"
      # Bewusst ohne gzip- und buffering-Middleware: Zunder komprimiert selbst, und
      # Pufferung bricht die SSE-Streams von /api/sync/events.
      - "traefik.http.services.zunder.loadbalancer.server.port=8080"
