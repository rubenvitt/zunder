name: CI

# Pushes to main and version tags run everything including the image build;
# pull requests run the checks only. Feature branches get CI via their PR.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keep in sync with RUST_VERSION in the Dockerfile.
  RUST_TOOLCHAIN: "1.97"
  NODE_VERSION: "22"

# The Tauri app shell (apps/zunder-app/src-tauri, package zunder-app) is
# intentionally not built here: it is not a member of the root workspace,
# needs webkit2gtk/GTK system libraries on Linux and Xcode/Android SDKs for
# the mobile targets, and is not part of the deployed artifact. Its logic
# lives in zunder-core and in the webview-free crate zunder-local (second
# member of the src-tauri workspace), which the `local` job checks and
# tests, including a sync run against the real server.

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --locked
      # zunder-import run (the real CLI) against the real server binary.
      - name: Import gegen echten Server
        env:
          ZUNDER_SERVER_BIN: ${{ github.workspace }}/target/debug/zunder-server
        run: |
          cargo build --locked -p zunder-server
          cargo test --locked -p zunder-import --test server_e2e -- --ignored

  local:
    name: zunder-local (fmt, clippy, test, Sync gegen Server)
    runs-on: ubuntu-24.04
    env:
      TAURI_MANIFEST: apps/zunder-app/src-tauri/Cargo.toml
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: local
          workspaces: |
            . -> target
            apps/zunder-app/src-tauri -> target
      - name: cargo fmt
        run: cargo fmt --manifest-path "$TAURI_MANIFEST" --all --check
      # Only zunder-local: the zunder-app package needs webkit2gtk.
      - name: cargo clippy
        run: cargo clippy --manifest-path "$TAURI_MANIFEST" -p zunder-local --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --manifest-path "$TAURI_MANIFEST" -p zunder-local --locked
      - name: Sync gegen echten Server
        env:
          ZUNDER_SERVER_BIN: ${{ github.workspace }}/target/debug/zunder-server
        run: |
          cargo build --locked -p zunder-server
          cargo test --manifest-path "$TAURI_MANIFEST" -p zunder-local --test server_e2e --locked -- --ignored

  web:
    name: Web (typecheck, test, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      # Includes the shared vectors from crates/zunder-core/tests/vectors
      # (merge, HLC order, validation); a missing directory fails the run.
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (Playwright gegen echten Server)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      # Release build: the tempo budget (< 100 ms per interaction, cold start
      # < 1 s) is measured in these tests and should not suffer from a debug
      # server.
      - name: Build zunder-server
        run: cargo build --release --locked --bin zunder-server
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Build web UI
        working-directory: web
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      # The UI is already built (dist/); the real server serves it via ZUNDER_WEB_DIR=dist.
      - name: Run Playwright (echter Server)
        working-directory: web
        env:
          ZUNDER_E2E_BACKEND: real
          ZUNDER_SERVER_BIN: ${{ github.workspace }}/target/release/zunder-server
        run: npx playwright test
      # The mock server is used for UI development; keep it in step with the real one.
      - name: Run Playwright (Mock)
        working-directory: web
        env:
          ZUNDER_E2E_BACKEND: mock
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14
          if-no-files-found: ignore

  image:
    name: Container-Image (GHCR, amd64 + arm64)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [rust, local, web, e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # QEMU is only needed for the small runtime stage of the foreign
      # architecture; Rust and the web UI are cross-built natively (see
      # Dockerfile).
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
