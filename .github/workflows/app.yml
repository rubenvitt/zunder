name: App

# Desktop app (macOS, Apple Silicon). Pull requests that touch the app, the
# web UI or zunder-core only build it. A release (release.yml calls this
# workflow with the tag after every green push to main; a version tag v*
# pushed by hand starts it directly) builds it signed with the Developer ID,
# notarizes it and publishes a GitHub release with latest.json; installed
# apps update themselves from there
# (apps/zunder-app/src-tauri/src/update.rs). The tag sets the app version.
# The release stays a draft until every asset is uploaded, so
# releases/latest never points to a release without latest.json.
# Third-party actions are pinned to commits: this job holds the signing keys.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "apps/zunder-app/**"
      - "web/**"
      - "crates/zunder-core/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Version tag (vX.Y.Z) to build and publish
        type: string
        required: true
      notes:
        description: Release notes (semantic-release); empty lets GitHub generate them
        type: string
        default: ""

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keep in sync with ci.yml.
  RUST_TOOLCHAIN: "1.97"
  NODE_VERSION: "22"

jobs:
  macos:
    name: Desktop (macOS)
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      # Empty: build only.
      TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/zunder-app/src-tauri -> target
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            apps/zunder-app/package-lock.json
            web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: apps/zunder-app
      - run: npm ci --no-audit --no-fund
        working-directory: web

      - name: Bauen
        if: env.TAG == ''
        working-directory: apps/zunder-app
        run: npm run build -- --bundles app

      - name: Release vorbereiten
        if: env.TAG != ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          for name in TAURI_SIGNING_PRIVATE_KEY APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
            APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8; do
            [ -n "${!name}" ] || { echo "::error::Secret $name fehlt"; exit 1; }
          done
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          # The updater only installs strictly higher versions, so the tag is the version.
          version="${TAG#v}"
          printf '{"version":"%s","bundle":{"createUpdaterArtifacts":true}}\n' "$version" \
            > "$RUNNER_TEMP/release.conf.json"

      - name: Bauen, signieren, notarisieren, hochladen
        id: tauri
        if: env.TAG != ''
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Ruben Vitt (H95J852PKP)"
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        with:
          projectPath: apps/zunder-app
          args: --config ${{ runner.temp }}/release.conf.json
          tagName: ${{ env.TAG }}
          releaseName: Zunder __VERSION__
          releaseBody: |
            Desktop-App für macOS (Apple Silicon). Installierte Apps aktualisieren sich selbst.

            ${{ inputs.notes }}
          generateReleaseNotes: ${{ !inputs.notes }}
          releaseDraft: true

      - name: Release veröffentlichen
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          gh api --method PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" \
            -F draft=false -f make_latest=true > /dev/null
