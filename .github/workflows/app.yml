name: App

# Desktop app (macOS, Apple Silicon). Pull requests that touch the app, the
# web UI or zunder-core only build it. A release (release.yml calls this
# workflow with the tag after every green push to main; a version tag v*
# pushed by hand starts it directly) builds it signed with the Developer ID,
# notarizes it and publishes a GitHub release with latest.json; installed
# apps update themselves from there
# (apps/zunder-app/src-tauri/src/update.rs). The tag sets the app version.
# The release stays a draft until every asset is uploaded, so
# releases/latest never points to a release without latest.json.
# A release also uploads the iOS app to TestFlight (job ios).
# Third-party actions are pinned to commits: this job holds the signing keys.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "apps/zunder-app/**"
      - "web/**"
      - "crates/zunder-core/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Version tag (vX.Y.Z) to build and publish
        type: string
        required: true
      notes:
        description: Release notes (semantic-release); empty lets GitHub generate them
        type: string
        default: ""

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keep in sync with ci.yml.
  RUST_TOOLCHAIN: "1.97"
  NODE_VERSION: "22"

jobs:
  macos:
    name: Desktop (macOS)
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      # Empty: build only.
      TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/zunder-app/src-tauri -> target
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            apps/zunder-app/package-lock.json
            web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: apps/zunder-app
      - run: npm ci --no-audit --no-fund
        working-directory: web

      # Share extension (apps/zunder-app/share): built and signed before the
      # app, the Tauri bundler copies it into Contents/PlugIns
      # (bundle.macOS.files) and signs only the app around it. Releases sign
      # it with the Developer ID (own keychain, removed right after), pull
      # requests ad hoc.
      - name: Teilen-Erweiterung bauen
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        working-directory: apps/zunder-app
        run: |
          command -v xcodegen > /dev/null || brew install xcodegen
          if [ -n "$TAG" ]; then
            version="${TAG#v}"
            identity="Developer ID Application: Ruben Vitt (H95J852PKP)"
            export SHARE_KEYCHAIN="$RUNNER_TEMP/share.keychain-db"
            password="$(uuidgen)"
            security create-keychain -p "$password" "$SHARE_KEYCHAIN"
            security set-keychain-settings -lut 3600 "$SHARE_KEYCHAIN"
            security unlock-keychain -p "$password" "$SHARE_KEYCHAIN"
            printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/share-cert.p12"
            security import "$RUNNER_TEMP/share-cert.p12" -k "$SHARE_KEYCHAIN" \
              -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            rm "$RUNNER_TEMP/share-cert.p12"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$SHARE_KEYCHAIN" > /dev/null
            # codesign finds the certificate chain only in the search list.
            original=$(security list-keychains -d user | tr -d '"')
            security list-keychains -d user -s "$SHARE_KEYCHAIN" $original
            appex=$(share/build-macos.sh "$version" "$identity")
            security list-keychains -d user -s $original
            security delete-keychain "$SHARE_KEYCHAIN"
          else
            appex=$(share/build-macos.sh 0.0.0)
          fi
          printf '{"bundle":{"macOS":{"files":{"PlugIns/ZunderShare.appex":"%s"}}}}\n' "$appex" \
            > "$RUNNER_TEMP/share.conf.json"

      - name: Bauen
        if: env.TAG == ''
        working-directory: apps/zunder-app
        run: npm run build -- --bundles app --config "$RUNNER_TEMP/share.conf.json"

      - name: Release vorbereiten
        if: env.TAG != ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          for name in TAURI_SIGNING_PRIVATE_KEY APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
            APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8; do
            [ -n "${!name}" ] || { echo "::error::Secret $name fehlt"; exit 1; }
          done
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          # The updater only installs strictly higher versions, so the tag is the version.
          version="${TAG#v}"
          printf '{"version":"%s","bundle":{"createUpdaterArtifacts":true}}\n' "$version" \
            > "$RUNNER_TEMP/release.conf.json"

      - name: Bauen, signieren, notarisieren, hochladen
        id: tauri
        if: env.TAG != ''
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Ruben Vitt (H95J852PKP)"
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        with:
          projectPath: apps/zunder-app
          args: --config ${{ runner.temp }}/release.conf.json --config ${{ runner.temp }}/share.conf.json
          tagName: ${{ env.TAG }}
          releaseName: Zunder __VERSION__
          releaseBody: |
            Desktop-App für macOS (Apple Silicon). Installierte Apps aktualisieren sich selbst.

            ${{ inputs.notes }}
          generateReleaseNotes: ${{ !inputs.notes }}
          releaseDraft: true

      - name: Release veröffentlichen
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          gh api --method PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" \
            -F draft=false -f make_latest=true > /dev/null

  # iOS on pull requests: builds the app with the share extension for the
  # simulator, unsigned (the TestFlight build below needs the signing keys).
  # Checks the generated Xcode project, the Swift code of the extension and
  # the Rust code for iOS.
  ios-check:
    name: iOS (Simulator, unsigniert)
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ios-sim
          workspaces: apps/zunder-app/src-tauri -> target
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            apps/zunder-app/package-lock.json
            web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: apps/zunder-app
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Xcode-Projekt erzeugen
        working-directory: apps/zunder-app
        run: |
          command -v xcodegen > /dev/null || brew install xcodegen
          npx tauri ios init --ci --skip-targets-install
          ruby share/add-ios-extension.rb src-tauri/gen/apple 0.0.0
          (cd src-tauri/gen/apple && xcodegen generate)
      - name: Bauen (Simulator)
        working-directory: apps/zunder-app
        run: npx tauri ios build --ci --no-sign --target aarch64-sim
      - name: Erweiterung eingebettet
        working-directory: apps/zunder-app
        run: |
          app=$(find src-tauri/gen/apple/build -maxdepth 3 -name '*.app' -type d | head -1)
          test -n "$app"
          test -f "$app/PlugIns/ZunderShare.appex/ZunderShare"
          plutil -p "$app/PlugIns/ZunderShare.appex/Info.plist" | grep -q com.apple.share-services
          codesign -d --entitlements - "$app/PlugIns/ZunderShare.appex" 2>&1 | grep -q group.dev.rubeen.zunder

  # iOS app to TestFlight, releases only (the build needs signing). Xcode
  # signs automatically through the App Store Connect API key (Admin role:
  # it creates the distribution certificate and profile itself). The app
  # record for dev.rubeen.zunder must exist in App Store Connect. The Xcode
  # project (gen/apple) is not checked in and is generated here.
  ios:
    name: iOS (TestFlight)
    if: inputs.tag || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ios
          workspaces: apps/zunder-app/src-tauri -> target
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            apps/zunder-app/package-lock.json
            web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: apps/zunder-app
      - run: npm ci --no-audit --no-fund
        working-directory: web

      - name: API-Schlüssel ablegen
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          for name in APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8; do
            [ -n "${!name}" ] || { echo "::error::Secret $name fehlt"; exit 1; }
          done
          # altool only looks for the key here, under this name.
          dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$dir"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$dir/AuthKey_$APPLE_API_KEY.p8"
          echo "APPLE_API_KEY_PATH=$dir/AuthKey_$APPLE_API_KEY.p8" >> "$GITHUB_ENV"

      - name: Xcode-Projekt erzeugen
        working-directory: apps/zunder-app
        run: |
          command -v xcodegen > /dev/null || brew install xcodegen
          npx tauri ios init --ci --skip-targets-install
          # init brings Tauri's placeholder icons; ours are opaque (App Store rule).
          cp src-tauri/icons/ios/*.png src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset/
          # Share extension and App Group (apps/zunder-app/share).
          ruby share/add-ios-extension.rb src-tauri/gen/apple "${TAG#v}"
          (cd src-tauri/gen/apple && xcodegen generate)

      - name: Bauen und signieren
        working-directory: apps/zunder-app
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        # The tag is the version (CFBundleShortVersionString and CFBundleVersion).
        run: |
          npx tauri ios build --ci --export-method app-store-connect \
            --config "{\"version\":\"${TAG#v}\"}"

      - name: Zu TestFlight hochladen
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          xcrun altool --upload-app --type ios \
            --file apps/zunder-app/src-tauri/gen/apple/build/arm64/Zunder.ipa \
            --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"
